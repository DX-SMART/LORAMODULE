name: GitHub 流量自动存档与报表

on:
  schedule:
    - cron: '0 20 * * *' # 每天北京时间凌晨 4 点运行
  workflow_dispatch:      # 允许手动点击运行

permissions:
  contents: write

jobs:
  archive-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 获取流量数据
        run: |
          mkdir -p traffic
          DATE=$(date +%Y-%m-%d)
          
          # 1. 获取访问量数据
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               https://api.github.com/repos/DX-SMART/LoRaModule/traffic/views \
               > traffic/views_$DATE.json
          
          # 2. 获取克隆量数据
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               https://api.github.com/repos/DX-SMART/LoRaModule/traffic/clones \
               > traffic/clones_$DATE.json

          # 3. 获取热门点击路径
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               https://api.github.com/repos/DX-SMART/LoRaModule/traffic/popular/paths \
               > traffic/paths_$DATE.json

          # 4. 🔥【新增】获取引流渠道来源数据 (Referring Sites)
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               https://api.github.com/repos/DX-SMART/LoRaModule/traffic/popular/referrers \
               > traffic/referrers_$DATE.json

      - name: 提取当日基础数据
        run: |
          DATE=$(date +%Y-%m-%d)
          
          DAILY_V=$(jq '.views[-1].count // 0' traffic/views_$DATE.json)
          DAILY_V_U=$(jq '.views[-1].uniques // 0' traffic/views_$DATE.json)
          TOTAL_VIEWS=$(jq '.count // 0' traffic/views_$DATE.json)
          TOTAL_V_UNIQUES=$(jq '.uniques // 0' traffic/views_$DATE.json)
          TOTAL_CLONES=$(jq '.clones[-1].count // 0' traffic/clones_$DATE.json)
          TOTAL_C_UNIQUES=$(jq '.clones[-1].uniques // 0' traffic/clones_$DATE.json)
          
          NEW_LINE="| $DATE | $DAILY_V | $DAILY_V_U | $TOTAL_VIEWS / $TOTAL_V_UNIQUES | $TOTAL_CLONES / $TOTAL_C_UNIQUES |"
          echo "$NEW_LINE" > traffic/today_line.txt

      - name: 🐍 执行 Python 脚本累加并更新总排行榜
        run: |
          python update_traffic.py
          
          if [ -f traffic/today_line.txt ]; then
            cat traffic/today_line.txt >> 流量统计报告.md
          fi

      - name: 保存到仓库并清理垃圾文件
        run: |
          git config --global user.name "DX-SMART-BOT"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 强制删除本地的临时中转文件，确保不进仓库
          rm -f traffic/today_line.txt
          
          git add traffic/ 流量统计报告.md
          git commit -m "自动更新流量与历史总排行榜: $(date +%Y-%m-%d)" || exit 0
          git push
