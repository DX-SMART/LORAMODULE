name: GitHub 流量自動存檔與報表

on:
  schedule:
    - cron: '0 20 * * *' # 每天北京時間凌晨 4 點運行
  workflow_dispatch:      # 允許手動點擊運行

permissions:
  contents: write

jobs:
  archive-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 獲取流量數據
        run: |
          mkdir -p traffic
          DATE=$(date +%Y-%m-%d)
          
          # 1. 獲取訪問量數據
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               https://api.github.com/repos/DX-SMART/LoRaModule/traffic/views \
               > traffic/views_$DATE.json
          
          # 2. 獲取克隆量數據
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               https://api.github.com/repos/DX-SMART/LoRaModule/traffic/clones \
               > traffic/clones_$DATE.json

          # 3. 獲取熱門點擊路徑
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               https://api.github.com/repos/DX-SMART/LoRaModule/traffic/popular/paths \
               > traffic/paths_$DATE.json

      - name: 提取當日基礎數據 (保留原歷史表功能)
        run: |
          DATE=$(date +%Y-%m-%d)
          REPORT_FILE="流量統計報告.md"
          
          DAILY_V=$(jq '.views[-1].count // 0' traffic/views_$DATE.json)
          DAILY_V_U=$(jq '.views[-1].uniques // 0' traffic/views_$DATE.json)
          TOTAL_VIEWS=$(jq '.count // 0' traffic/views_$DATE.json)
          TOTAL_V_UNIQUES=$(jq '.uniques // 0' traffic/views_$DATE.json)
          TOTAL_CLONES=$(jq '.count // 0' traffic/clones_$DATE.json)
          TOTAL_C_UNIQUES=$(jq '.uniques // 0' traffic/clones_$DATE.json)
          
          NEW_LINE="| $DATE | $DAILY_V | $DAILY_V_U | $TOTAL_VIEWS / $TOTAL_V_UNIQUES | $TOTAL_CLONES / $TOTAL_C_UNIQUES |"
          
          # 先臨時存入一個檔案，等等給 Python 拼接
          echo "$NEW_LINE" > traffic/today_line.txt

      - name: 🐍 執行 Python 腳本累加並更新總排行榜
        run: |
          # 呼叫剛才寫好的 Python 進行全歷史數據累加與排序
          python update_traffic.py
          
          # 將今日新增的趨勢行追加進報告
          if [ -f traffic/today_line.txt ]; then
            cat traffic/today_line.txt >> 流量統計報告.md
          fi

      - name: 保存到倉庫
        run: |
          git config --global user.name "DX-SMART-BOT"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 把統計的 json 資料庫和 md 報告都提交上去
          git add traffic/ 流量統計報告.md
          git commit -m "自動更新流量與歷史總排行榜: $(date +%Y-%m-%d)" || exit 0
          git push
